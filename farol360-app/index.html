<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAROL360 Análises</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#eef2f1;--surface:#ffffff;--surface-2:#e4ebe9;--surface-3:#f3f7f6;
    --ink:#131d1c;--ink-soft:#4f5f5c;--ink-faint:#84918d;--line:#d5dcda;--line-soft:#e5ebe9;
    --accent:#0e3536;--accent-ink:#0c2c2c;--accent-soft:#d9e8e5;--brand:#b3712a;
    --good:#2c7a58;--good-soft:#dcefe6;--mod:#9a7415;--mod-soft:#f4ead0;
    --crit:#b23b3b;--crit-soft:#f4dcdc;--info:#2b5c8a;--info-soft:#dbe8f4;
    --shadow:0 1px 2px rgba(14,26,26,.06),0 8px 24px rgba(14,26,26,.06);
    --shadow-lg:0 12px 40px rgba(14,26,26,.14);--r:12px;--r-sm:8px;
    --sans:"IBM Plex Sans",system-ui,sans-serif;--serif:"IBM Plex Serif",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a1413;--surface:#12201f;--surface-2:#1c2c2a;--surface-3:#0e1a19;
    --ink:#e6ecea;--ink-soft:#93a3a0;--ink-faint:#697a77;--line:#243532;--line-soft:#1b2b29;
    --accent:#2c6f6c;--accent-ink:#63b3ad;--accent-soft:#123130;--brand:#d59a4e;
    --good:#4bab82;--good-soft:#16281f;--mod:#cba13f;--mod-soft:#2a2312;
    --crit:#d16565;--crit-soft:#2c1717;--info:#5f96c8;--info-soft:#132132;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0a1413;--surface:#12201f;--surface-2:#1c2c2a;--surface-3:#0e1a19;
    --ink:#e6ecea;--ink-soft:#93a3a0;--ink-faint:#697a77;--line:#243532;--line-soft:#1b2b29;
    --accent:#2c6f6c;--accent-ink:#63b3ad;--accent-soft:#123130;--brand:#d59a4e;
    --good:#4bab82;--good-soft:#16281f;--mod:#cba13f;--mod-soft:#2a2312;
    --crit:#d16565;--crit-soft:#2c1717;--info:#5f96c8;--info-soft:#132132;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4,h5{margin:0;text-wrap:balance;line-height:1.2}
  button{font-family:inherit;cursor:pointer}a{color:var(--accent-ink)}
  img{max-width:100%}[hidden]{display:none!important}
  .app{height:100%;display:flex;flex-direction:column}
  .demo-bar{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--info-soft);color:var(--info);font-size:11.5px;font-weight:600;padding:6px 16px;text-align:center;padding-top:calc(6px + env(safe-area-inset-top,0px))}
  .topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .saldo{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;padding:4px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-3)}
  .saldo .sl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:700}
  .saldo .sv{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--good)}
  .modopt.off{opacity:.55}.modopt.off .price{color:var(--crit)}
  .cli-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .cli{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .cli-h{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;margin-bottom:10px}
  .cli-n{font-weight:600;font-size:14px}.cli-e{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .cli-saldo{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--good);white-space:nowrap}
  .cli-edit{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line-soft)}
  .cli-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cli-row input[type=number]{width:96px}
  .mini{font-size:11px;font-weight:600;color:var(--ink-soft);min-width:112px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}
  .brand .wm{font-size:15px;letter-spacing:.02em}.brand .wm span{color:var(--brand)}
  .brand .tag{font-size:10px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:1px}
  .spacer{flex:1}
  .who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
  .who .n{font-weight:600;font-size:13px}.who .c{font-size:11px;color:var(--ink-soft)}
  .iconbtn{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);display:grid;place-items:center}
  .iconbtn:hover{color:var(--ink);border-color:var(--ink-faint)}
  .main{flex:1;overflow:auto}.wrap{max-width:1060px;margin:0 auto;padding:26px 20px 60px}
  .login{min-height:100%;display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  .login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:32px 30px}
  .login-brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px;text-align:center}
  .login-brand .wm{font-size:24px;font-weight:600}.login-brand .wm span{color:var(--brand)}
  .login-brand .tag{font-size:10.5px;color:var(--ink-faint);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  .field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink-soft)}
  .req{color:var(--crit)}
  input,select,textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
  textarea{resize:vertical;min-height:74px;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);padding:11px 18px;font-size:14px;font-weight:600}
  .btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}.btn.block{width:100%}.btn.sm{padding:8px 13px;font-size:13px}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--ink-faint);filter:none}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .login-note{margin-top:18px;font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.5}
  .page-head{margin-bottom:22px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
  .page-head h1{font-size:23px;font-weight:600}.page-head p{margin:8px 0 0;color:var(--ink-soft);max-width:60ch}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:var(--shadow)}
  .card:not([disabled]):hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .card[disabled]{opacity:.6;cursor:default}
  .card .ic{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
  .card h3{font-size:16px;font-weight:600}.card p{margin:0;color:var(--ink-soft);font-size:12.5px;flex:1}
  .card .foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-faint);padding-top:4px;border-top:1px solid var(--line-soft)}
  .card .foot .v{font-family:var(--mono);color:var(--ink-soft)}.card .go{margin-left:auto;color:var(--accent);font-weight:600}
  .tagpill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--mod-soft);color:var(--mod)}
  .backlink{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:600;padding:0;margin-bottom:14px}
  .backlink:hover{color:var(--ink)}
  .form-grid{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
  .form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
  .form-card h2{font-size:17px;font-weight:600;margin-bottom:3px}.form-card .sub{color:var(--ink-soft);font-size:12.5px;margin-bottom:20px}
  .checks{display:flex;flex-wrap:wrap;gap:8px}
  .chk{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;background:var(--surface-3);user-select:none}
  .chk input{width:auto;margin:0;accent-color:var(--accent)}.chk.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg .opt{padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;background:var(--surface-3);font-weight:500}
  .seg .opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .attach{margin-top:8px;background:var(--surface-3);border:1px dashed var(--line);color:var(--ink-soft);border-radius:var(--r-sm);padding:9px 13px;font-size:12.5px;font-weight:500;width:100%}
  .attach:hover{border-color:var(--accent);color:var(--accent-ink)}
  .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:0}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .panel h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:12px}
  .modrow{display:flex;flex-direction:column;gap:7px}
  .modopt{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-3);font-size:12.5px}
  .modopt.on{border-color:var(--accent);background:var(--accent-soft)}.modopt input{width:auto;margin:0;accent-color:var(--accent)}
  .modopt .mm{font-weight:600;color:var(--ink)}.modopt .md{display:block;font-size:11px;color:var(--ink-soft)}
  .modopt .price{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
  .cost{display:flex;align-items:baseline;justify-content:space-between;padding-top:12px;margin-top:12px;border-top:1px solid var(--line-soft)}
  .cost .lbl{font-size:12px;color:var(--ink-soft)}.cost .val{font-family:var(--mono);font-weight:600;font-size:16px}.cost .val small{font-size:11px;color:var(--ink-faint);font-weight:400}
  .loading{min-height:60vh;display:grid;place-items:center;text-align:center}
  .beacon{position:relative;width:132px;height:132px;margin:0 auto;perspective:320px}
  .beacon .lring{position:absolute;inset:6px;border:4px solid var(--accent);border-radius:50%;opacity:.85}
  .beacon .lh{position:absolute;inset:0;width:100%;height:100%}
  .beacon .optic{position:absolute;left:50%;top:42%;width:122px;height:32px;margin:-16px 0 0 -61px;transform-style:preserve-3d;animation:optic 3.2s linear infinite;will-change:transform}
  .beacon .bowtie{position:absolute;inset:0;background:linear-gradient(90deg,transparent 3%,var(--brand) 27%,var(--brand) 73%,transparent 97%);clip-path:polygon(0 8%,50% 42%,100% 8%,100% 92%,50% 58%,0 92%);opacity:.9}
  .beacon .flare{position:absolute;left:50%;top:42%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--brand);box-shadow:0 0 16px 5px color-mix(in srgb,var(--brand) 55%,transparent);animation:flare 1.6s ease-in-out infinite}
  @keyframes optic{to{transform:rotateY(360deg)}}
  @keyframes flare{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
  @media (prefers-reduced-motion:reduce){.beacon .optic{animation:none;transform:rotateY(26deg)}.beacon .flare{animation:none;opacity:1}}
  .loading h3{font-size:16px;font-weight:600;margin:16px 0 6px}.loading p{color:var(--ink-soft);font-size:13px}
  .errbox{background:var(--crit-soft);border:1px solid var(--crit);color:var(--crit);border-radius:var(--r-sm);padding:14px 16px;font-size:13px;margin-top:14px}
  .errbox b{display:block;margin-bottom:4px}
  .report-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .report-head .meta{flex:1;min-width:200px}.report-actions{display:flex;gap:8px;flex-wrap:wrap}
  .doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .doc-band{height:5px;background:linear-gradient(90deg,var(--accent),var(--brand))}.doc-inner{padding:34px 40px}
  .rep-title .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
  .rep-title h1{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15}
  .rep-title .who2{color:var(--ink-soft);margin-top:8px;font-size:14px}
  .rep-sub{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;padding:14px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
  .rep-sub .l{color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:600}
  .rep-sub .d{color:var(--ink);font-weight:500;margin-top:2px;font-size:12px}
  .sec{margin-top:26px}.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sec-h .num{font-family:var(--mono);font-size:11px;color:#fff;background:var(--ink);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:500}
  .sec-h h2{font-size:15px;font-weight:600}.sec p{margin:0 0 10px;font-size:13.5px}.sec p.serif{font-family:var(--serif);font-size:14px;line-height:1.6}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin:0}
  th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;background:var(--surface-3)}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r-sm);margin:6px 0 12px}
  .pill{display:inline-flex;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
  .pill.good{background:var(--good-soft);color:var(--good)}.pill.mod{background:var(--mod-soft);color:var(--mod)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
  .ev{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-soft)}
  .star{color:var(--accent);font-weight:700}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:4px 0 12px}
  .kpi{background:var(--surface-3);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:13px 15px}
  .kpi .kl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600}
  .kpi .kv{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:4px;line-height:1.15}
  .kpi .kd{font-size:11px;color:var(--ink-soft);margin-top:5px}
  .swot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .swot .q{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface-3)}
  .swot .q h5{font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
  .swot .q.f h5{color:var(--good)}.swot .q.w h5{color:var(--crit)}.swot .q.o h5{color:var(--info)}.swot .q.t h5{color:var(--mod)}
  .swot ul{margin:0;padding-left:16px;font-size:12px;display:flex;flex-direction:column;gap:4px}
  .callout{display:flex;gap:11px;background:var(--accent-soft);border-radius:var(--r-sm);padding:13px 15px;margin:6px 0 12px;font-size:12.5px;color:var(--accent-ink)}
  .callout b{color:var(--ink)}
  .onepager{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px 24px;margin:6px 0 4px}
  .onepager h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:14px}
  .onepager .op-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
  .onepager .op b{display:block;font-family:var(--mono);font-size:20px;margin-bottom:2px}.onepager .op span{font-size:11px;color:#aeb6c6}
  .onepager .op-concl{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;color:#d7dce6;line-height:1.55}
  .footnote{margin-top:26px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-faint);line-height:1.55}
  .footnote a{color:var(--ink-faint)}
  .num-c{font-family:var(--mono)}
  .plainul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:5px}
  .resumo{background:var(--surface-3);border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:15px 18px;margin:2px 0 12px}
  .resumo ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink)}
  .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:8px 0 4px}
  .meterbox{background:var(--surface-3);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:12px 14px}
  .meterbox .ml{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;margin-bottom:9px}
  .meter{display:flex;align-items:center;gap:10px}
  .meter .mtrack{flex:1;height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden}
  .meter .mfill{height:100%;background:var(--accent);border-radius:6px}
  .meter .mval{font-family:var(--mono);font-weight:600;font-size:13px;min-width:52px;text-align:right}
  .bars{display:flex;flex-direction:column;gap:9px;margin:2px 0 12px}
  .barrow{display:grid;grid-template-columns:180px 1fr 60px;align-items:center;gap:10px;font-size:12px}
  .barrow .blabel{color:var(--ink);font-weight:500;line-height:1.25}
  .btrack{height:14px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
  .bfill{height:100%;border-radius:4px;background:var(--accent)}
  .brange{position:absolute;top:0;left:0;height:100%;background:var(--accent);opacity:.85;border-radius:4px}
  .barrow .bval{font-family:var(--mono);color:var(--ink-soft);text-align:right}
  @media (max-width:520px){.barrow{grid-template-columns:120px 1fr 52px}}
  @media (max-width:560px){.who{display:none}}
  @media (max-width:780px){.form-grid{grid-template-columns:1fr}.side{position:static}.doc-inner{padding:24px 20px}.swot{grid-template-columns:1fr}.rep-title h1{font-size:21px}}
  @page{margin:16mm 14mm}
  @media print{
    .demo-bar,.topbar,.report-head,.backlink{display:none!important}
    .main{overflow:visible}.wrap{max-width:none;padding:0}
    .doc{border:none;box-shadow:none;border-radius:0}.doc-band{display:none}.doc-inner{padding:0}
    body{background:#fff;font-size:10.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sec{margin-top:22px}.sec,table,.kpi-row,.swot,.onepager,.tbl-wrap,.kpi{break-inside:avoid}

function sec(n,t,inner){return '<div class="sec"><div class="sec-h"><span class="num">'+n+'</span><h2>'+esc(t)+'</h2></div>'+inner+'</div>';}
function star(est){return est?' <span class="star">*</span>':'';}
function limpo(v){var s=String(v==null?'':v).trim().toLowerCase();return !!s&&s!=='n/a'&&s.indexOf('não aplic')<0&&s.indexOf('nao aplic')<0&&s.indexOf('não solicit')<0&&s.indexOf('não dispon')<0&&s.indexOf('nao dispon')<0;}
function filtra(arr,keys){return (arr||[]).filter(function(x){return keys.some(function(k){return limpo(x[k]);});});}
function strs(arr){return (arr||[]).filter(function(x){return limpo(x);});}
function parseNums(s){var m=String(s==null?'':s).match(/-?\d+(?:[.,]\d+)?/g);return m?m.map(function(x){return parseFloat(x.replace(',','.'));}):[];}
function meterBox(label,val){var v=Math.max(0,Math.min(100,Math.round(Number(val)||0)));return '<div class="meterbox"><div class="ml">'+esc(label)+'</div><div class="meter"><div class="mtrack"><div class="mfill" style="width:'+v+'%"></div></div><div class="mval">'+v+'/100</div></div></div>';}
function metersRow(pairs){var b=pairs.filter(function(p){return p[1]!=null&&p[1]!==''&&p[1]!=='—';}).map(function(p){return meterBox(p[0],p[1]);});return b.length?'<div class="meters">'+b.join('')+'</div>':'';}
function kpiRange(faixa){var n=parseNums(faixa);if(n.length<2)return '';var a=Math.min(n[0],n[1]),b=Math.max(n[0],n[1]);var max=(b<=0?Math.abs(a)+1:b)*1.25;var lo=Math.max(0,a)/max*100,hi=Math.min(b,max)/max*100;return '<div class="btrack" style="margin-top:8px"><div class="brange" style="left:'+lo+'%;width:'+Math.max(4,(hi-lo))+'%"></div></div>';}
function barsBlock(items){return '<div class="bars">'+items.map(function(it){var p=Math.max(3,Math.min(100,Number(it.pct)||0));return '<div class="barrow"><div class="blabel" title="'+esc(it.label)+'">'+esc(it.label)+'</div><div class="btrack"><div class="bfill" style="width:'+p+'%'+(it.tone?(';background:'+it.tone):'')+'"></div></div><div class="bval">'+esc(it.val||'')+'</div></div>';}).join('')+'</div>';}
function govBench(b){return tbl(['Referência','Município','Média','Diferença'],b.map(function(x){var t=String(x.diferenca||'').toLowerCase();var cls=(t.indexOf('-')>=0||t.indexOf('abaixo')>=0)?'crit':((t.indexOf('+')>=0||t.indexOf('acima')>=0)?'good':'mod');return '<tr><td>'+esc(x.referencia||'')+'</td><td class="num-c">'+esc(x.municipio||'')+'</td><td class="num-c">'+esc(x.media||'')+'</td><td><span class="pill '+cls+'">'+esc(x.diferenca||'—')+'</span></td></tr>';}).join(''));}
function swotBox(sw){sw=sw||{};return '<div class="swot"><div class="q f"><h5>Forças</h5><ul>'+(sw.forcas||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="q w"><h5>Fraquezas</h5><ul>'+(sw.fraquezas||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="q o"><h5>Oportunidades</h5><ul>'+(sw.oportunidades||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="q t"><h5>Ameaças</h5><ul>'+(sw.ameacas||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div>';}
function odsPill(st){var t=String(st||'').toLowerCase();var c='mod';if(t.indexOf('atingid')>=0||t.indexOf('bom')>=0)c='good';else if(t.indexOf('crít')>=0||t.indexOf('crit')>=0)c='crit';return '<span class="pill '+c+'">'+esc(st||'—')+'</span>';}
function prioPill(p){var t=String(p||'').toLowerCase();var c='mod';if(t.indexOf('máx')>=0||t.indexOf('max')>=0||t.indexOf('alta')>=0)c='crit';else if(t.indexOf('baixa')>=0)c='good';return '<span class="pill '+c+'">'+esc(p||'—')+'</span>';}
function footFontes(){return (state.fontes&&state.fontes.length)?('<br><span style="opacity:.7">Fontes ('+state.fontes.length+'): '+state.fontes.slice(0,10).map(function(f,i){return '<a href="'+esc(f.url)+'" target="_blank" rel="noopener">['+(i+1)+']</a>';}).join(' ')+'</span>'):'';}

 var _rm=filtra(r.roadmap,['acao','horizonte']);if(_rm.length)s.push(sec('07','Diagnóstico & Roadmap',tbl(['Horizonte','Ação prioritária'],_rm.map(function(x){return '<tr><td><b>'+esc(x.horizonte)+'</b></td><td>'+esc(x.acao)+'</td></tr>';}).join(''))));
 var nota='<b>Metodologia FAROL360:</b> valores com <span class="star">*</span> são estimativa, não dado observado; a coluna Evidência classifica cada fonte. '+(conf.fontes_cliente_consideradas?'Inclui fontes fornecidas pelo cliente. ':'')+(conf.limitacoes&&conf.limitacoes.length?'<br><b>Limitações:</b> '+conf.limitacoes.map(esc).join('; ')+'.':'')+'<br><b>Aviso:</b> baseado em fontes públicas; não substitui auditoria nem consultoria especializada.'+footFontes();
 return docWrap('Relatório de Análise de Empresa',cab.empresa||d.empresa||'Empresa',(cab.setor||d.setor||'')+' · '+(cab.cidade||d.cidade||''),[['Período',cab.periodo||d.periodo||''],['Modo',cab.modo||d.modo||'Completo'],['Consulta',MODELOS[state.modelo].nome],['Confiabilidade',(conf.nota_0_100||cab.confiabilidade_0_100||'—')+'/100']],s.join(''),nota);

async function adminApi(acao,extra){
 const tok=state.cliente&&state.cliente.token;
 const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify(Object.assign({acao:acao},extra||{}))});

 const j=await r.json();
 if(!r.ok||!j.ok)throw new Error((j&&j.erro)||('Erro '+r.status));
 return j;
}

 adminState.carregando=false;if(state.view==='admin')render();}
async function adminRecarregar(){try{const j=await adminApi('listar');adminState.clientes=j.clientes||[];}catch(e){adminState.erro=String(e.message||e);}if(state.view==='admin')render();}
function analisesChecks(sel,prefixo){return ANALISES_META.map(function(a){var on=(sel||[]).indexOf(a[0])>=0;return '<label class="chk '+(on?'on':'')+'"><input type="checkbox" data-an="'+prefixo+'" value="'+a[0]+'" '+(on?'checked':'')+'>'+esc(a[1])+'</label>';}).join('');}
function cliCard(c){var adm=c.papel==='admin';
 return '<div class="cli" data-id="'+esc(c.id)+'">'+
  '<div class="cli-h"><div><div class="cli-n">'+esc(c.nome||c.email)+(adm?' <span class="tagpill" style="background:var(--info-soft);color:var(--info)">admin</span>':'')+(c.ativo===false?' <span class="tagpill" style="background:var(--crit-soft);color:var(--crit)">inativo</span>':'')+'</div><div class="cli-e">'+esc(c.email||'')+'</div></div>'+
   '<div class="cli-saldo">'+saldoBR(c.saldo_centavos)+'</div></div>'+
  (adm?'<div class="hint">Conta do administrador — sem cobrança.</div>':
  '<div class="cli-edit"><div class="cli-row"><label class="mini">Saldo (R$)</label><input type="number" step="0.50" min="0" data-cli-saldo value="'+centReais(c.saldo_centavos)+'"><button class="btn ghost sm" data-cli-cred="500">+5</button><button class="btn ghost sm" data-cli-cred="1000">+10</button></div>'+
   '<div class="cli-row"><label class="mini">Análises liberadas</label><div class="checks">'+analisesChecks(c.analises,'ed')+'</div></div>'+
   '<div class="cli-row"><label class="chk '+(c.ativo!==false?'on':'')+'"><input type="checkbox" data-cli-ativo '+(c.ativo!==false?'checked':'')+'>Conta ativa</label><span style="flex:1"></span><button class="btn sm" data-cli-save>Salvar</button></div></div>')+
  '</div>';}
function admin(){
 var novo=adminState.novoOpen?('<div class="form-card" style="margin-bottom:16px"><h2>Novo cliente</h2><div class="sub">A senha é definida por você e informada ao cliente.</div>'+
  '<div class="field"><label>Nome</label><input id="nc_nome" type="text" placeholder="Nome do cliente ou organização"></div>'+
  '<div class="field"><label>E-mail <span class="req">*</span></label><input id="nc_email" type="email" placeholder="cliente@dominio.com"></div>'+
  '<div class="field"><label>Senha <span class="req">*</span></label><input id="nc_senha" type="text" placeholder="Mínimo 6 caracteres"></div>'+
  '<div class="field"><label>Saldo inicial (R$)</label><input id="nc_saldo" type="number" step="0.50" min="0" value="0"></div>'+
  '<div class="field"><label>Análises liberadas (plano)</label><div class="checks">'+analisesChecks([],'nc')+'</div><div class="hint">Perfil = Figura Pública · Empresarial = Empresa · Político/Gestão = Governo + Figura Pública · Completo = as três.</div></div>'+
  '<div style="display:flex;gap:8px;margin-top:6px"><button class="btn" id="nc_criar">Criar cliente</button><button class="btn ghost" id="nc_cancelar">Cancelar</button></div></div>'):'';
 var lista=adminState.carregando?'<div class="loading" style="min-height:30vh"><div><div class="beam">'+farol(40)+'</div><p style="margin-top:10px">Carregando clientes…</p></div></div>':
  (adminState.clientes.length?'<div class="cli-list">'+adminState.clientes.map(cliCard).join('')+'</div>':'<p style="color:var(--ink-soft)">Nenhum cliente cadastrado ainda.</p>');
 return '<button class="backlink" data-act="back">'+IC.back+' Catálogo</button>'+
  '<div class="report-head"><div class="meta"><div class="eyebrow">Administração</div><h1 style="font-size:22px;font-weight:600">Clientes e créditos</h1></div><div class="report-actions"><button class="btn sm" id="ad_novo">+ Novo cliente</button><button class="btn ghost sm" id="ad_recarregar">Atualizar</button></div></div>'+
  (adminState.erro?'<div class="errbox"><b>Erro.</b>'+esc(adminState.erro)+'</div>':'')+
  (adminState.msg?'<div class="callout" style="margin-bottom:14px">'+IC.info+'<div>'+esc(adminState.msg)+'</div></div>':'')+
  novo+lista;
}
function coletaAnalises(scope,prefixo){var out=[];(scope||app).querySelectorAll('input[data-an="'+prefixo+'"]:checked').forEach(function(el){out.push(el.value);});return out;}
function bindAdmin(){
 var nv=document.getElementById('ad_novo');if(nv)nv.addEventListener('click',function(){adminState.novoOpen=!adminState.novoOpen;adminState.erro='';render();});
 var rc=document.getElementById('ad_recarregar');if(rc)rc.addEventListener('click',function(){adminState.msg='';adminState.erro='';adminRecarregar();});
 var cancel=document.getElementById('nc_cancelar');if(cancel)cancel.addEventListener('click',function(){adminState.novoOpen=false;render();});
 app.querySelectorAll('[data-an]').forEach(function(el){el.addEventListener('change',function(){el.closest('.chk').classList.toggle('on',el.checked);});});
 var criar=document.getElementById('nc_criar');if(criar)criar.addEventListener('click',async function(){
  var email=(document.getElementById('nc_email').value||'').trim(),senha=document.getElementById('nc_senha').value||'';
  if(!email||!senha){adminState.erro='Informe e-mail e senha.';render();return;}
  criar.disabled=true;criar.textContent='Criando…';
  try{await adminApi('criar',{nome:document.getElementById('nc_nome').value||'',email:email,senha:senha,saldo_centavos:reaisCent(document.getElementById('nc_saldo').value),analises:coletaAnalises(document,'nc')});
   adminState.novoOpen=false;adminState.msg='Cliente '+email+' criado.';await adminRecarregar();
  }catch(e){adminState.erro=String(e.message||e);criar.disabled=false;criar.textContent='Criar cliente';render();}
 });
 app.querySelectorAll('[data-cli-save]').forEach(function(btn){btn.addEventListener('click',async function(){
  var card=btn.closest('.cli'),id=card.dataset.id;
  btn.disabled=true;btn.textContent='Salvando…';
  try{await adminApi('atualizar',{id:id,saldo_centavos:reaisCent(card.querySelector('[data-cli-saldo]').value),analises:coletaAnalises(card,'ed'),ativo:card.querySelector('[data-cli-ativo]').checked});
   adminState.msg='Cliente atualizado.';await adminRecarregar();
  }catch(e){adminState.erro=String(e.message||e);btn.disabled=false;btn.textContent='Salvar';render();}
 });});
 app.querySelectorAll('[data-cli-cred]').forEach(function(btn){btn.addEventListener('click',async function(){
  var card=btn.closest('.cli'),id=card.dataset.id,delta=Number(btn.dataset.cliCred)||0;
  btn.disabled=true;
  try{await adminApi('creditar',{id:id,delta_centavos:delta});adminState.msg='Créditos adicionados.';await adminRecarregar();
  }catch(e){adminState.erro=String(e.message||e);btn.disabled=false;render();}
 });});
}
function bindCommon(){app.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>{const a=el.dataset.act;
  if(a==='logout')sair();
  if(a==='theme')toggleTheme();
  if(a==='admin'){adminAbrir();}
  if(a==='back'){state.dados={};state.relatorio=null;state.erro=null;go('catalog');}
  if(a==='gerar')gerar();if(a==='pdf')window.print();}));
 app.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{state.promptId=el.dataset.open;state.dados={};state.erro=null;go('form');}));}
function bindForm(){app.querySelectorAll('[data-f]').forEach(el=>{el.addEventListener('input',()=>state.dados[el.dataset.f]=el.value);el.addEventListener('change',()=>state.dados[el.dataset.f]=el.value);});
 app.querySelectorAll('[data-seg]').forEach(el=>el.addEventListener('click',()=>{state.dados[el.dataset.seg]=el.dataset.val;el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));el.classList.add('on');}));
 app.querySelectorAll('[data-chk]').forEach(el=>el.addEventListener('change',()=>{const f=el.dataset.chk;const a=state.dados[f]||[];if(el.checked){if(!a.includes(el.value))a.push(el.value);}else{const i=a.indexOf(el.value);if(i>=0)a.splice(i,1);}state.dados[f]=a;el.closest('.chk').classList.toggle('on',el.checked);}));
 app.querySelectorAll('[data-mod]').forEach(el=>el.addEventListener('change',()=>{state.modelo=el.value;app.querySelectorAll('.modopt').forEach(m=>m.classList.remove('on'));el.closest('.modopt').classList.add('on');atualizarConsulta();}));}
async function gerar(){const p=PROMPTS[state.promptId];p.campos.forEach(f=>{if(f.padrao&&!state.dados[f.id])state.dados[f.id]=f.padrao;});
 const falta=p.campos.filter(f=>f.obrig&&!state.dados[f.id]);
 if(falta.length){alert('Preencha: '+falta.map(f=>f.label).join(', '));return;}
 const tok=state.cliente&&state.cliente.token;if(!tok){sair();return;}
 const H={'content-type':'application/json','Authorization':'Bearer '+tok};
 state.erro=null;state.fase='Pesquisando dados na web…';go('loading');
 try{
  const r1=await fetch('/api/pesquisar',{method:'POST',headers:H,body:JSON.stringify({promptId:state.promptId,dados:state.dados,modelo:state.modelo})});
  if(r1.status===401){sair();return;}
  const j1=await r1.json();
  if(!r1.ok||!j1.ok){state.erro=((j1&&j1.erro)||('Erro '+r1.status));go('form');return;}
  state.fontes=j1.fontes||[];
  state.fase='Redigindo o relatório…';go('loading');
  const r2=await fetch('/api/analisar',{method:'POST',headers:H,body:JSON.stringify({promptId:state.promptId,dados:state.dados,modelo:state.modelo,contexto:j1.contexto||''})});
  if(r2.status===401){sair();return;}
  const j2=await r2.json();
  if(!r2.ok||!j2.ok){state.erro=((j2&&j2.erro)||'')+((j2&&j2.detalhe)?(' — detalhe: '+j2.detalhe):'')||('Erro '+r2.status);go('form');return;}
  if(state.cliente&&typeof j2.saldo==='number')state.cliente.saldo=j2.saldo;
  state.relatorio=j2.relatorio;go('report');
 }catch(e){state.erro='Falha de rede ou servidor: '+String(e);go('form');}
}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',dark?'light':'dark');}
restaurarSessao();
</script>
</body>
